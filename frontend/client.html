<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мої заявки — Особистий кабінет клієнта</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Перейти до основного вмісту</a>

  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand">
        <span class="brand-badge">SLA 24/7</span>
        <span>ТехноСервіс</span>
      </a>
      <nav id="main-nav" class="nav-links" aria-label="Головна навігація"></nav>
    </div>
  </header>

  <main id="main-content" class="container">
    <div class="page-header" style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem;">
      <div>
        <h1>Особистий кабінет клієнта</h1>
        <p id="client-welcome" class="muted">Завантаження профілю...</p>
      </div>
      <a href="/create-request" class="btn btn-primary">+ Нова заявка на ремонт</a>
    </div>

    <div id="client-alert" aria-live="polite"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Трек-номер</th>
            <th>Послуга та пристрій</th>
            <th>Статус</th>
            <th>Контроль SLA</th>
            <th>Вартість</th>
            <th>Дії</th>
          </tr>
        </thead>
        <tbody id="my-requests-body">
          <tr><td colspan="6" class="muted">Завантаження ваших звернень...</td></tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- Модальне вікно деталей заявки клієнта -->
  <div id="detail-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-dialog">
      <div class="modal-header">
        <div>
          <h2 id="modal-title">Деталі звернення</h2>
          <span id="modal-subtitle" class="muted"></span>
        </div>
        <button type="button" id="close-modal-btn" class="btn btn-outline btn-sm" aria-label="Закрити вікно">✕ Закрити</button>
      </div>
      <div id="modal-alert" aria-live="polite"></div>
      <div id="modal-content"></div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© 2026 Сервісний центр «ТехноСервіс»</span>
      <span>Кабінет клієнта</span>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script>
    initNavigation("client");

    const user = getStoredUser();
    if (!user) {
      window.location.href = "/login";
    } else if (user.role === "manager") {
      window.location.href = "/manager";
    }

    const alertBox = document.getElementById("client-alert");
    const tbody = document.getElementById("my-requests-body");
    const modal = document.getElementById("detail-modal");
    const modalContent = document.getElementById("modal-content");
    const modalAlert = document.getElementById("modal-alert");

    if (user) {
      document.getElementById("client-welcome").textContent = `${user.full_name} (${user.email} • ${user.phone})`;
    }

    async function loadMyRequests() {
      try {
        const list = await apiRequest("/api/requests/my");
        if (list.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6">У вас ще немає зареєстрованих заявок. <a href="/create-request">Створити перше звернення</a>.</td></tr>`;
          return;
        }

        tbody.innerHTML = list
          .map(
            (r) => `
            <tr class="${r.is_overdue ? "row-overdue" : ""}">
              <td><strong>${escapeHtml(r.tracking_code)}</strong><div class="muted">${formatDateTime(r.created_at)}</div></td>
              <td>
                <div>${escapeHtml(r.service_title)}</div>
                <div class="muted">${escapeHtml(r.device_type)} — ${escapeHtml(r.device_model)}</div>
              </td>
              <td><span class="badge status-${escapeHtml(r.status)}">${escapeHtml(r.status_label)}</span></td>
              <td>${formatSlaBadge(r)}<div class="muted">до ${formatDateTime(r.sla_deadline)}</div></td>
              <td>${r.estimated_cost ? Number(r.estimated_cost).toFixed(2) + " грн" : "—"}</td>
              <td>
                <button type="button" class="btn btn-outline btn-sm open-detail-btn" data-id="${r.id}">Детальніше</button>
              </td>
            </tr>
          `
          )
          .join("");

        document.querySelectorAll(".open-detail-btn").forEach((btn) => {
          btn.addEventListener("click", () => openRequestModal(Number(btn.dataset.id)));
        });
      } catch (err) {
        renderAlert(alertBox, "error", err.message);
      }
    }

    async function openRequestModal(requestId) {
      renderAlert(modalAlert, null);
      modalContent.innerHTML = `<p class="muted">Завантаження деталей заявки...</p>`;
      modal.classList.add("open");

      try {
        const req = await apiRequest(`/api/requests/${requestId}`);
        document.getElementById("modal-title").textContent = `Заявка ${req.tracking_code}`;
        document.getElementById("modal-subtitle").textContent = `${req.device_type} — ${req.device_model}`;

        const historyHtml = req.status_history
          .map(
            (h) => `
            <li class="timeline-item">
              <strong>${escapeHtml(h.new_status_label)}</strong> <span class="muted">• ${formatDateTime(h.changed_at)}</span>
              ${h.comment ? `<div>${escapeHtml(h.comment)}</div>` : ""}
            </li>
          `
          )
          .join("");

        const commentsHtml =
          req.comments.length > 0
            ? req.comments
                .map(
                  (c) => `
                  <div class="comment-item">
                    <strong>${escapeHtml(c.author_name)}</strong> <span class="muted">• ${formatDateTime(c.created_at)}</span>
                    <p style="margin: 0.35rem 0 0;">${escapeHtml(c.body)}</p>
                  </div>
                `
                )
                .join("")
            : `<p class="muted">Повідомлень поки немає.</p>`;

        const canCancel = req.status === "new";

        modalContent.innerHTML = `
          <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin-bottom: 1rem;">
            <span class="badge status-${escapeHtml(req.status)}">${escapeHtml(req.status_label)}</span>
            ${formatSlaBadge(req)}
            <span class="badge badge-cat">Вартість: ${req.estimated_cost ? Number(req.estimated_cost).toFixed(2) + " грн" : "Уточнюється"}</span>
          </div>

          <p><strong>Опис проблеми:</strong> ${escapeHtml(req.problem_description)}</p>

          ${
            canCancel
              ? `<div style="margin-bottom: 1rem;">
                  <button type="button" id="cancel-req-btn" class="btn btn-danger btn-sm">Скасувати заявку</button>
                 </div>`
              : ""
          }

          <div class="form-grid form-grid-2" style="margin-top: 1rem;">
            <div>
              <h3>Хронологія статусів</h3>
              <ul class="timeline">${historyHtml}</ul>
            </div>
            <div>
              <h3>Чат із менеджером</h3>
              <div class="comment-list" style="margin-bottom: 0.85rem;">${commentsHtml}</div>
              <form id="client-comment-form">
                <div class="form-group">
                  <label for="client_comment_body">Нове повідомлення</label>
                  <textarea id="client_comment_body" required minlength="1" maxlength="2000" placeholder="Напишіть уточнення для майстра..."></textarea>
                </div>
                <button type="submit" class="btn btn-primary btn-sm" style="margin-top: 0.5rem;">Надіслати</button>
              </form>
            </div>
          </div>
        `;

        const cancelBtn = document.getElementById("cancel-req-btn");
        if (cancelBtn) {
          cancelBtn.addEventListener("click", async () => {
            try {
              await apiRequest(`/api/requests/${requestId}/cancel`, { method: "POST" });
              await loadMyRequests();
              await openRequestModal(requestId);
              renderAlert(modalAlert, "success", "Заявку успішно скасовано.");
            } catch (err) {
              renderAlert(modalAlert, "error", err.message);
            }
          });
        }

        document.getElementById("client-comment-form").addEventListener("submit", async (e) => {
          e.preventDefault();
          const body = document.getElementById("client_comment_body").value.trim();
          if (!body) return;
          try {
            await apiRequest(`/api/requests/${requestId}/comments`, {
              method: "POST",
              body: JSON.stringify({ body, is_internal: false }),
            });
            await openRequestModal(requestId);
          } catch (err) {
            renderAlert(modalAlert, "error", err.message);
          }
        });
      } catch (err) {
        renderAlert(modalAlert, "error", err.message);
      }
    }

    document.getElementById("close-modal-btn").addEventListener("click", () => modal.classList.remove("open"));
    modal.addEventListener("click", (e) => {
      if (e.target === modal) modal.classList.remove("open");
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modal.classList.contains("open")) {
        modal.classList.remove("open");
      }
    });

    loadMyRequests();
  </script>
</body>
</html>
