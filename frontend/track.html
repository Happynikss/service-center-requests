<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Відстеження статусу заявки — ТехноСервіс</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Перейти до основного вмісту</a>

  <header class="site-header">
    <div class="container header-inner">
      <a href="/" class="brand">
        <span class="brand-badge">SLA 24/7</span>
        <span>ТехноСервіс</span>
      </a>
      <nav id="main-nav" class="nav-links" aria-label="Головна навігація"></nav>
    </div>
  </header>

  <main id="main-content" class="container">
    <div class="page-header">
      <h1>Перевірка стану звернення за трек-номером</h1>
      <p>Введіть номер звернення формату <code>SC-2026-XXXX</code>, щоб переглянути поточний етап робіт, дедлайн SLA та коментарі майстра.</p>
    </div>

    <form id="track-form" class="card" style="margin-bottom: 1.25rem;">
      <div class="toolbar" style="margin-bottom: 0.5rem;">
        <div style="flex: 1; min-width: 220px;">
          <label for="tracking_code" class="muted" style="display: block; margin-bottom: 0.25rem;">Трек-номер заявки</label>
          <input type="text" id="tracking_code" name="tracking_code" placeholder="Наприклад: SC-2026-0001" required>
        </div>
        <div style="align-self: flex-end;">
          <button type="submit" class="btn btn-primary">Знайти заявку</button>
        </div>
      </div>
      <div class="muted">
        Демонстраційні номери:
        <button type="button" class="btn btn-outline btn-sm demo-code" data-code="SC-2026-0001">SC-2026-0001</button>
        <button type="button" class="btn btn-outline btn-sm demo-code" data-code="SC-2026-0003">SC-2026-0003</button>
        <button type="button" class="btn btn-outline btn-sm demo-code" data-code="SC-2026-0005">SC-2026-0005</button>
      </div>
    </form>

    <div id="track-alert" aria-live="polite"></div>
    <div id="track-result" aria-live="polite"></div>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <span>© 2026 Сервісний центр «ТехноСервіс»</span>
      <span>Публічний трекінг звернень</span>
    </div>
  </footer>

  <script src="/js/api.js"></script>
  <script>
    initNavigation("track");

    const trackForm = document.getElementById("track-form");
    const codeInput = document.getElementById("tracking_code");
    const alertBox = document.getElementById("track-alert");
    const resultBox = document.getElementById("track-result");

    async function fetchAndRenderTracking(code) {
      const cleaned = code.trim().toUpperCase();
      if (!cleaned) return;
      codeInput.value = cleaned;
      renderAlert(alertBox, null);
      resultBox.innerHTML = `<p class="muted">Пошук інформації за номером ${escapeHtml(cleaned)}...</p>`;

      try {
        const req = await apiRequest(`/api/requests/track/${encodeURIComponent(cleaned)}`);
        const historyHtml = req.status_history
          .map(
            (h) => `
            <li class="timeline-item">
              <div><strong>${escapeHtml(h.new_status_label)}</strong> <span class="muted">• ${formatDateTime(h.changed_at)}</span></div>
              ${h.comment ? `<div style="margin-top: 0.25rem;">${escapeHtml(h.comment)}</div>` : ""}
              <div class="muted">Виконавець: ${escapeHtml(h.changed_by_name)}</div>
            </li>
          `
          )
          .join("");

        const commentsHtml =
          req.comments.length > 0
            ? req.comments
                .map(
                  (c) => `
                  <div class="comment-item ${c.is_internal ? "internal" : ""}">
                    <div style="display: flex; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap;">
                      <strong>${escapeHtml(c.author_name)} (${c.author_role === "manager" ? "Менеджер" : "Клієнт"})</strong>
                      <span class="muted">${formatDateTime(c.created_at)}</span>
                    </div>
                    <p style="margin: 0.45rem 0 0;">${escapeHtml(c.body)}</p>
                  </div>
                `
                )
                .join("")
            : `<p class="muted">Публічних коментарів за цією заявкою ще немає.</p>`;

        resultBox.innerHTML = `
          <article class="card">
            <div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 0.75rem; align-items: center; margin-bottom: 1rem;">
              <div>
                <h2 style="margin: 0;">Звернення ${escapeHtml(req.tracking_code)}</h2>
                <span class="muted">Створено: ${formatDateTime(req.created_at)}</span>
              </div>
              <div style="display: flex; flex-wrap: wrap; gap: 0.5rem;">
                <span class="badge status-${escapeHtml(req.status)}">${escapeHtml(req.status_label)}</span>
                ${formatSlaBadge(req)}
              </div>
            </div>

            <div class="form-grid form-grid-2" style="margin-bottom: 1.25rem;">
              <div>
                <p><strong>Послуга:</strong> ${escapeHtml(req.service_title)}</p>
                <p><strong>Пристрій:</strong> ${escapeHtml(req.device_type)} — ${escapeHtml(req.device_model)}</p>
                <p><strong>Замовник:</strong> ${escapeHtml(req.contact_name)}</p>
              </div>
              <div>
                <p><strong>Пріоритет:</strong> ${escapeHtml(PRIORITY_LABELS[req.priority] || req.priority)}</p>
                <p><strong>Дедлайн SLA:</strong> ${formatDateTime(req.sla_deadline)}</p>
                <p><strong>Узгоджена вартість:</strong> ${req.estimated_cost ? Number(req.estimated_cost).toFixed(2) + " грн" : "Очікує оцінки"}</p>
              </div>
            </div>

            <div style="margin-bottom: 1.25rem;">
              <h3>Опис несправності</h3>
              <p class="card" style="background: var(--surface-alt); box-shadow: none;">${escapeHtml(req.problem_description)}</p>
            </div>

            <div class="form-grid form-grid-2">
              <div>
                <h3>Історія зміни статусів</h3>
                <ul class="timeline">${historyHtml}</ul>
              </div>
              <div>
                <h3>Повідомлення та уточнення</h3>
                <div class="comment-list">${commentsHtml}</div>
              </div>
            </div>
          </article>
        `;
      } catch (err) {
        resultBox.innerHTML = "";
        renderAlert(alertBox, "error", err.message);
      }
    }

    trackForm.addEventListener("submit", (e) => {
      e.preventDefault();
      fetchAndRenderTracking(codeInput.value);
    });

    document.querySelectorAll(".demo-code").forEach((btn) => {
      btn.addEventListener("click", () => {
        fetchAndRenderTracking(btn.dataset.code || "");
      });
    });

    const initialCode = new URLSearchParams(window.location.search).get("code");
    if (initialCode) {
      fetchAndRenderTracking(initialCode);
    }
  </script>
</body>
</html>
